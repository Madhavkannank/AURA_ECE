version: "3.9"

services:
  mongo:
    image: docker.io/library/mongo:7
    container_name: aura-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aura-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=aura_ece
    depends_on:
      - mongo
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aura-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - AURA_API_BASE=http://backend:8000
    depends_on:
      - backend
    ports:
      - "8501:8501"

volumes:
  mongo_data:
